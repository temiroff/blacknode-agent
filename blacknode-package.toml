[package]
name = "blacknode-agent"
version = "0.2.0"
description = "Persistent memory and executive mission orchestration for Blacknode."
requires-blacknode = ">=0.3.0"
layer = "agent"
component-mode = true

[categories]
"Agent" = "#d946ef"

[components.executive]
description = "Task planning, mission execution, skill selection, confirmation, and mission review."
default = false
capabilities = [
  "agent.executive", "agent.task-planner", "agent.mission-runner",
  "agent.skill-registry", "agent.confirmation", "agent.mission-review",
]

[components.memory]
description = "Persistent robot task, attempt, evaluation, failure, and policy memory with conservative improvement recommendations."
default = true
capabilities = ["agent.memory"]
nodes = ["components/memory/nodes"]
templates = ["components/memory/templates"]
node-types = [
  "AdaptationRecommendation", "EpisodeMemoryIngest", "RobotMemoryQuery", "RobotTaskCreate",
  "TaskEvaluationRecord"
]

[components.memory.dependencies]
pip = []
imports = []
